name: Book Recommender - Notebook Execution

on:
  push:
    branches: [ main, master, develop ]

  pull_request:
    branches: [ main, master, develop ]

  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel numpy pandas scikit-learn flask

      - name: Register Jupyter Kernel
        run: |
          python -m ipykernel install \
            --user \
            --name conda-base-py \
            --display-name "conda-base-py"

      - name: Show Available Jupyter Kernels
        run: |
          jupyter kernelspec list

      - name: Execute final_brs.ipynb
        working-directory: BookRecommenderSystem_MLProject
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute final_brs.ipynb \
            --output final_brs_executed.ipynb \
            --ExecutePreprocessor.kernel_name=conda-base-py \
            --ExecutePreprocessor.timeout=600

      - name: Show Recommendation Results
        working-directory: BookRecommenderSystem_MLProject
        run: |
          python - <<'PY'
          import nbformat

          notebook = nbformat.read(
              "final_brs_executed.ipynb",
              as_version=4
          )

          print("\n========================================")
          print("BOOK RECOMMENDER SYSTEM RESULTS")
          print("========================================\n")

          for cell in notebook.cells:

              if cell.cell_type != "code":
                  continue

              # Find the cells that generate recommendations
              if (
                  'recommend_books("1984")' in cell.source
                  or 'model("1984")' in cell.source
              ):

                  print("Input Book: 1984")
                  print("\nRecommended Books:\n")

                  for output in cell.get("outputs", []):

                      if output.output_type == "stream":
                          print(output.text)

                      elif output.output_type in [
                          "execute_result",
                          "display_data"
                      ]:
                          text = output.get(
                              "data",
                              {}
                          ).get("text/plain")

                          if text:
                              print(text)

                  print("\n========================================")


      - name: Display Notebook Execution Result
        if: success()
        run: |
          echo "Notebook executed successfully"
          echo "Executed notebook: BookRecommenderSystem_MLProject/final_brs_executed.ipynb"

      - name: Upload Executed Notebook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-bRS-executed-notebook
          path: BookRecommenderSystem_MLProject/final_brs_executed.ipynb
          retention-days: 30