name: Book Recommender Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd book_recommender_flask
        pip install -r requirements.txt pytest
    
    - name: Run Pytest Test Cases
      run: |
        cd book_recommender_flask
        pytest tests/test_recommendations.py -v
      
    - name: Test Summary
      if: always()
      run: |
        echo "Test Results:"
        echo "✓ Empty book name handling"
        echo "✓ Display recommendations"
        echo "✓ No duplicate recommendations"
        echo "✓ Input book not in recommendations"
